
name: JioTV JSON Converter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run JioTV Converter
        run: python footcric/giotvwala/convert.py

      - name: Commit Generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f footcric/giotvwala/channels.json
          git diff --cached --quiet || git commit -m "Update JioTV channels JSON"
          git push
