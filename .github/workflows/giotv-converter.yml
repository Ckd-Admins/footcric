
name: JioTV Converter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert M3U
        run: python giotvwala/convert.py

      - name: Verify JSON
        run: |
          ls -lh giotvwala/channels.json
          python -c "import json; d=json.load(open('giotvwala/channels.json')); print('Total:', len(d))"

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add giotvwala/channels.json
          git diff --cached --quiet || git commit -m "Update channels JSON"
          git push
