name: Update M3U to JSON

on:
  schedule:
    # Yeh har 6 ghante mein automatically run hoga (aap apne hisaab se time badal sakte hain)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger ke liye

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Conversion Script
        run: python footcric/giotvwala/convert.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add footcric/giotvwala/channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jstr4web.json [skip ci]" && git push)
