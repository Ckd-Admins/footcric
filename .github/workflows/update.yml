name: Update M3U to Channels JSON

on:
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante me auto update hoga
  workflow_dispatch: # Manual run ke liye button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Script in giotvwala folder
        run: python giotvwala/convert.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add giotvwala/channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update giotvwala/channels.json [skip ci]" && git push)
