
name: All Channels API Fetch

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  fetch-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch API JSON
        run: python allchannels/fetch.py

      - name: Commit Updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add allchannels/response.json

          if ! git diff --cached --quiet; then
            git commit -m "Update allchannels API response"
            git push
          else
            echo "No changes in API response"
          fi
